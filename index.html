<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Fast mobile-friendly URL shortener powered by LiteAI.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <title>LinkLite — URL Shortener</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh}
    .wrap{width:min(900px,92%);margin:auto;padding:24px 0 44px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
    .brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}
    h1{font-size:22px;margin:0}.sub{font-size:13px;color:#6b7280;margin-top:3px}
    .theme{border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
    .hero{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 12px 35px #1118270d}
    .hero h2{font-size:clamp(28px,6vw,48px);line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}
    .hero p{color:#6b7280;margin:0 0 22px}
    .form{display:flex;gap:10px}.form input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:14px;padding:15px;font-size:16px;outline:none}
    .form input:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}
    button.primary{border:0;border-radius:14px;background:#111827;color:white;padding:0 20px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .result{display:none;margin-top:18px;border:1px solid #e5e7eb;border-radius:16px;padding:15px;background:#fafafa}
    .result.show{display:block}.short{font-size:18px;font-weight:750;word-break:break-all;margin-bottom:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
    .msg{min-height:20px;color:#b91c1c;font-size:14px;margin-top:10px}
    .section{margin-top:26px}.section h3{margin:0 0 12px;font-size:18px}
    .history{display:grid;gap:10px}.item{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}
    .item .long{font-size:13px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item a{color:inherit;text-decoration:none;font-weight:700;word-break:break-all}
    footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:25px}
    body.dark{background:#0b1020;color:#f9fafb} body.dark .hero,body.dark .item,body.dark .result{background:#121a2b;border-color:#24304a}
    body.dark .theme,body.dark .actions button{background:#121a2b;color:#fff;border-color:#334155}
    body.dark .form input{background:#0f172a;color:#fff;border-color:#334155}
    @media(max-width:620px){.wrap{padding-top:14px}.hero{padding:20px;border-radius:20px}.form{flex-direction:column}.form button{height:52px}.theme{padding:9px}.hero h2{font-size:34px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">LL</div><div><h1>LinkLite</h1><div class="sub">Fast URL Shortener</div></div></div>
    <button class="theme" id="themeBtn" aria-label="Toggle theme">◐</button>
  </header>

  <main>
    <section class="hero">
      <h2>Shorten your links.</h2>
      <p>Create a compact link in seconds. Built for mobile and ready to install as a PWA.</p>
      <form class="form" id="form">
        <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/your-long-link" required>
        <button class="primary" id="submit" type="submit">Shorten URL</button>
      </form>
      <div class="msg" id="msg" role="status"></div>
      <div class="result" id="result">
        <div class="short" id="shortUrl">—</div>
        <div class="actions">
          <button id="copyBtn">Copy</button>
          <button id="openBtn">Open</button>
          <button id="qrBtn">QR Code</button>
        </div>
      </div>
    </section>

    <section class="section">
      <h3>Recent links</h3>
      <div class="history" id="history"></div>
    </section>
  </main>
  <footer>Powered by LiteAI API • Your API key stays on the server</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const form = $("#form"), url = $("#url"), submit = $("#submit"), msg = $("#msg");
const result = $("#result"), shortUrl = $("#shortUrl"), historyBox = $("#history");
let currentShort = "";

function getHistory(){ try{return JSON.parse(localStorage.getItem("linklite_history")||"[]")}catch{return[]}}
function saveHistory(item){
  const h=getHistory().filter(x=>x.short_url!==item.short_url);
  h.unshift(item); localStorage.setItem("linklite_history",JSON.stringify(h.slice(0,20))); renderHistory();
}
function renderHistory(){
  const h=getHistory();
  historyBox.innerHTML=h.length ? h.map((x,i)=>`
    <div class="item">
      <div class="row"><a href="${x.short_url}" target="_blank" rel="noopener">${x.short_url}</a><button data-i="${i}" class="copyHistory">Copy</button></div>
      <div class="long">${x.source_url}</div>
    </div>`).join("") : '<div class="sub">No shortened links yet.</div>';
  document.querySelectorAll(".copyHistory").forEach(b=>b.onclick=async()=>{
    const item=h[+b.dataset.i]; await navigator.clipboard.writeText(item.short_url); b.textContent="Copied";
    setTimeout(()=>b.textContent="Copy",1200);
  });
}
form.addEventListener("submit",async e=>{
  e.preventDefault(); msg.textContent=""; submit.disabled=true; submit.textContent="Working…";
  try{
    const res=await fetch("/api/shorten",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({long_url:url.value.trim()})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"Request failed");
    if(!data.short_url) throw new Error("The API responded, but no short URL was found. Check the provider response in the server logs.");
    currentShort=data.short_url; shortUrl.textContent=currentShort; result.classList.add("show");
    saveHistory({short_url:currentShort,source_url:data.source_url,created_at:Date.now()});
  }catch(err){msg.textContent=err.message}
  finally{submit.disabled=false;submit.textContent="Shorten URL"}
});
$("#copyBtn").onclick=async()=>{await navigator.clipboard.writeText(currentShort);$("#copyBtn").textContent="Copied!";setTimeout(()=>$("#copyBtn").textContent="Copy",1200)};
$("#openBtn").onclick=()=>window.open(currentShort,"_blank","noopener");
$("#qrBtn").onclick=()=>window.open("https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(currentShort),"_blank","noopener");
$("#themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("linklite_dark",document.body.classList.contains("dark"))};
if(localStorage.getItem("linklite_dark")==="true") document.body.classList.add("dark");
renderHistory();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
